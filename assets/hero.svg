<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claudio Dall'Ara — engineer of observable systems</title>
  <desc id="desc">An animated observability control room connecting Kafka, OpenTelemetry, Prometheus and Grafana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#07111B"/><stop offset=".55" stop-color="#0B1624"/><stop offset="1" stop-color="#071018"/></linearGradient>
    <linearGradient id="accent" x1="152" y1="93" x2="926" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#7CF4C5"/><stop offset="1" stop-color="#64B5FF"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7CF4C5" stop-opacity=".28"/><stop offset="1" stop-color="#7CF4C5" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A8C7E8" stroke-opacity=".055"/></pattern>
    <style>.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.dash{stroke-dasharray:8 14;animation:flow 10s linear infinite}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-132}}@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.dash,.blink{animation:none}}</style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/><rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <circle cx="1005" cy="122" r="180" fill="url(#glow)" filter="url(#blur)"/><circle cx="228" cy="388" r="150" fill="#326E91" fill-opacity=".12" filter="url(#blur)"/>
  <rect x="28" y="28" width="1144" height="374" rx="18" stroke="#A8C7E8" stroke-opacity=".12"/>
  <g class="mono" font-size="12" letter-spacing="1.5"><circle cx="62" cy="58" r="5" fill="#FF6B6B"/><circle cx="80" cy="58" r="5" fill="#FFD166"/><circle cx="98" cy="58" r="5" fill="#7CF4C5"/><text x="122" y="63" fill="#7792AD">CLAUDIO.DALLARA / CONTROL_ROOM</text><text x="1082" y="63" fill="#7CF4C5">● ONLINE</text></g>
  <g transform="translate(74 110)"><text class="mono" x="0" y="0" fill="#7CF4C5" font-size="14" letter-spacing="3">DEVOPS · OBSERVABILITY · PRODUCT</text><text class="sans" x="0" y="66" fill="#F4F8FC" font-size="55" font-weight="750" letter-spacing="-2">Claudio Dall'Ara</text><text class="sans" x="0" y="112" fill="#A8BED2" font-size="23">I make complex systems observable,</text><text class="sans" x="0" y="144" fill="#A8BED2" font-size="23">reliable and useful.</text><rect y="181" width="340" height="46" rx="23" fill="#7CF4C5" fill-opacity=".1" stroke="#7CF4C5" stroke-opacity=".35"/><circle class="blink" cx="24" cy="204" r="5" fill="#7CF4C5"/><text class="mono" x="42" y="209" fill="#D8E7F4" font-size="13">AGILE LAB · ITALY · BUILDING</text></g>
  <g transform="translate(714 106)"><path class="dash" d="M61 68H200C221 68 229 90 229 110V133" stroke="url(#accent)" stroke-width="2"/><path class="dash" d="M229 189V214C229 235 210 244 190 244H61" stroke="url(#accent)" stroke-width="2"/><path class="dash" d="M229 189V214C229 235 250 244 270 244H396" stroke="url(#accent)" stroke-width="2"/>
    <g class="mono" font-size="12" text-anchor="middle"><g><rect x="0" y="42" width="122" height="52" rx="12" fill="#101F2E" stroke="#64B5FF" stroke-opacity=".55"/><text x="61" y="73" fill="#D8E7F4">KAFKA</text></g><g><rect x="168" y="130" width="122" height="60" rx="12" fill="#10251F" stroke="#7CF4C5" stroke-opacity=".75"/><text x="229" y="156" fill="#7CF4C5">OTel</text><text x="229" y="174" fill="#7792AD" font-size="9">COLLECT</text></g><g><rect x="0" y="218" width="122" height="52" rx="12" fill="#101F2E" stroke="#64B5FF" stroke-opacity=".55"/><text x="61" y="249" fill="#D8E7F4">PROMETHEUS</text></g><g><rect x="335" y="218" width="122" height="52" rx="12" fill="#101F2E" stroke="#64B5FF" stroke-opacity=".55"/><text x="396" y="249" fill="#D8E7F4">GRAFANA</text></g></g>
    <circle r="5" fill="#7CF4C5"><animateMotion dur="3s" repeatCount="indefinite" path="M61 68H200C221 68 229 90 229 110V133"/></circle><circle r="5" fill="#64B5FF"><animateMotion dur="3.8s" repeatCount="indefinite" path="M229 189V214C229 235 210 244 190 244H61"/></circle><circle r="5" fill="#7CF4C5"><animateMotion dur="4.4s" repeatCount="indefinite" path="M229 189V214C229 235 250 244 270 244H396"/></circle>
  </g>
  <g class="mono" font-size="10" fill="#526C84"><text x="74" y="378">BUILD 2026.10</text><text x="1037" y="378">SLO 99.9%</text></g>
</svg>
